name: install test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── ガード：Windows ジョブの run ブロックに日本語を書かせない ──────────────
  # PS5.1 は GitHub が書き出す一時ファイル(BOM無し)を ANSI として読むため、
  # run ブロック内の日本語が文字化けして落ちる。3回踏んだので機械で止める。
  # 対象は shell: powershell（＝PS5.1）のジョブだけ。pwsh(PS7) は BOM 無し UTF-8 を
  # 正しく読むので日本語を書いてよい。
  guard-no-japanese:
    name: ガード / Windows の run に日本語なし
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows ジョブの run ブロックを検査
        run: |
          set -e
          bad=0
          # windows で始まるジョブ〜次のジョブ定義までを切り出し、run: の中身だけ見る
          awk '/^  (windows-ps51|oneliner-windows):/{f=1} /^  [a-z-]+:$/{if($0 !~ /^  (windows-ps51|oneliner-windows):/) f=0} f' .github/workflows/test.yml \
            | grep -vE '^\s+(- )?name:' \
            | grep -vE '^\s+#' \
            | grep -P '[ぁ-んァ-ヶ一-龥]' > /tmp/ja.txt || true
          if [ -s /tmp/ja.txt ]; then
            echo 'Windows ジョブの run ブロックに日本語があります（PS5.1 で文字化けします）:'
            cat /tmp/ja.txt
            bad=1
          fi
          [ $bad -eq 0 ] && echo OK
          exit $bad

  # ── Mac / Linux ────────────────────────────────────────────────────────────
  posix:
    name: ${{ matrix.os }} / install.sh
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OSK_REPO_URL: ${{ github.workspace }}
      OSK_KIT_DIR: ${{ github.workspace }}/../osk-kit
      OSK_CLAUDE_DIR: ${{ github.workspace }}/../osk-claude
    steps:
      - uses: actions/checkout@v4

      - name: 構文チェック
        run: bash -n install.sh && bash -n uninstall.sh

      - name: クリーン環境でインストール
        run: bash install.sh

      - name: 配置されたものを確認
        run: |
          set -e
          test "$(ls "$OSK_CLAUDE_DIR"/commands/vault-*.md | wc -l)" -eq 5
          test "$(ls -d "$OSK_CLAUDE_DIR"/skills/vault-* | wc -l)" -eq 3
          test "$(ls "$OSK_CLAUDE_DIR"/skills/vault-scaffold/references/*.md | wc -l)" -eq 5
          test -f "$OSK_CLAUDE_DIR/.obsidian-starter-kit-manifest"
          echo OK

      - name: 2回目の実行でも失敗しないこと
        run: bash install.sh

      - name: 他人の同名コマンドを上書きしないこと
        run: |
          set -e
          rm -f "$OSK_CLAUDE_DIR/.obsidian-starter-kit-manifest"
          echo "自作の大事なコマンド" > "$OSK_CLAUDE_DIR/commands/vault-save.md"
          if bash install.sh; then echo "衝突を検出できていない"; exit 1; fi
          grep -q "自作の大事なコマンド" "$OSK_CLAUDE_DIR/commands/vault-save.md"
          echo OK

      - name: 上書き後アンインストールで元に戻ること
        run: |
          set -e
          OSK_FORCE=1 bash install.sh
          grep -q "自作の大事なコマンド" "$OSK_CLAUDE_DIR/.obsidian-starter-kit-backup/commands/vault-save.md"
          bash "$OSK_KIT_DIR/uninstall.sh"
          grep -q "自作の大事なコマンド" "$OSK_CLAUDE_DIR/commands/vault-save.md"
          test ! -f "$OSK_CLAUDE_DIR/commands/vault-init.md"
          echo OK

      - name: 既存 vault に足りないものだけ足す（既存資産を壊さないこと）
        run: |
          set -e
          export OSK_CLAUDE_DIR="$GITHUB_WORKSPACE/aug-claude"
          V="$GITHUB_WORKSPACE/existing-vault"
          mkdir -p "$V/.obsidian" "$V/私のメモ" "$V/仕事"
          echo '{"alwaysUpdateLinks":true,"customSetting":"大事な既存設定"}' > "$V/.obsidian/app.json"
          printf '# 既存のノート\n\n消えたら困る中身\n' > "$V/私のメモ/大事なノート.md"
          printf '# 仕事メモ\n\n既存の内容\n' > "$V/仕事/メモ.md"

          OSK_YES=1 bash "$OSK_KIT_DIR/install.sh" --vault "$V" --type 2

          # 既存の中身が無傷であること
          grep -q '消えたら困る中身' "$V/私のメモ/大事なノート.md" || { echo '既存ノートが壊れた'; exit 1; }
          grep -q '既存の内容' "$V/仕事/メモ.md" || { echo '既存ノートが壊れた'; exit 1; }
          test -d "$V/私のメモ" && test -d "$V/仕事" || { echo '既存フォルダが消えた'; exit 1; }

          # 既存の設定値が保たれ、無かったキーだけ補われていること
          node -e '
            const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            if(j.customSetting!=="大事な既存設定"){console.log("既存設定が上書きされた");process.exit(1)}
            if(!j.attachmentFolderPath){console.log("不足キーが補われていない");process.exit(1)}
          ' "$V/.obsidian/app.json"

          # 足りないものが追加されていること
          test -f "$V/00_はじめに.md" && test -f "$V/_ログ.md" || { echo '不足分が足されていない'; exit 1; }

          # 勝手にフォルダを増やしていないこと（Templates 以外）
          # -mindepth 1 が無いと $V 自身が数に入る
          n=$(find "$V" -mindepth 1 -maxdepth 1 -type d -not -name ".obsidian" | wc -l | tr -d ' ')
          [ "$n" -eq 3 ] || { echo "フォルダ数が $n（私のメモ/仕事/Templates の3つであるべき）"; exit 1; }

          # 再実行しても二重に足さないこと
          OSK_YES=1 bash "$OSK_KIT_DIR/install.sh" --vault "$V" --type 2 > /tmp/again.txt 2>&1
          grep -q '揃っています' /tmp/again.txt || { echo '冪等でない'; exit 1; }
          echo OK

      - name: Hermes に vault を教える（他のキーを壊さないこと）
        run: |
          set -e
          FH="$GITHUB_WORKSPACE/fake-hermes"
          ENVF="$FH/.env"
          mkdir -p "$FH"
          printf 'SOME_API_KEY=secret123\nOTHER_SETTING=abc\n' > "$ENVF"
          # 前のステップで残した衝突状態と混ざらないよう、専用の配置先を使う
          export OSK_CLAUDE_DIR="$GITHUB_WORKSPACE/hermes-claude"

          # 1回目：未設定の状態から設定される
          HERMES_HOME="$FH" OSK_HERMES=1 bash "$OSK_KIT_DIR/install.sh" --vault "$GITHUB_WORKSPACE/hv1" --type 2
          grep -q '^OBSIDIAN_VAULT_PATH=' "$ENVF" || { echo 'vault パスが書かれていない'; exit 1; }
          grep -q '^SOME_API_KEY=secret123$' "$ENVF" || { echo '既存キーが壊れた'; exit 1; }
          grep -q '^OTHER_SETTING=abc$' "$ENVF" || { echo '既存キーが壊れた'; exit 1; }

          # 2回目：別 vault に切り替えても行が増えない
          HERMES_HOME="$FH" OSK_HERMES=1 bash "$OSK_KIT_DIR/install.sh" --vault "$GITHUB_WORKSPACE/hv2" --type 1
          n=$(grep -c '^OBSIDIAN_VAULT_PATH=' "$ENVF")
          [ "$n" -eq 1 ] || { echo "OBSIDIAN_VAULT_PATH が $n 行ある（1行であるべき）"; exit 1; }
          grep -q 'hv2' "$ENVF" || { echo '新しい vault に切り替わっていない'; exit 1; }
          grep -q '^SOME_API_KEY=secret123$' "$ENVF" || { echo '既存キーが壊れた'; exit 1; }

          # 3回目：Hermes が無い環境では一切触らない
          HERMES_HOME="$GITHUB_WORKSPACE/no-hermes" bash "$OSK_KIT_DIR/install.sh" --vault "$GITHUB_WORKSPACE/hv3" --type 1 > /tmp/out.txt 2>&1
          if grep -q 'Hermes' /tmp/out.txt; then echo 'Hermes が無いのに触っている'; exit 1; fi
          echo OK

      - name: 生成物の JSON と参照先が壊れていないこと
        run: |
          set -e
          cd "examples/仕事のナレッジ_サンプル"
          for f in .obsidian/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
          test -d "$(node -pe "JSON.parse(require('fs').readFileSync('.obsidian/app.json','utf8')).newFileFolderPath")"
          test -d "$(node -pe "JSON.parse(require('fs').readFileSync('.obsidian/templates.json','utf8')).folder")"
          test -f "$(node -pe "JSON.parse(require('fs').readFileSync('.obsidian/daily-notes.json','utf8')).template").md"
          echo OK

  # ── Windows PowerShell 5.1（Windows 標準） ────────────────────────────────
  windows-ps51:
    name: windows / Windows PowerShell 5.1
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      OSK_REPO_URL: ${{ github.workspace }}
      OSK_KIT_DIR: ${{ github.workspace }}\..\osk-kit
      OSK_CLAUDE_DIR: ${{ github.workspace }}\..\osk-claude
    steps:
      - uses: actions/checkout@v4

      - name: バージョンと構文チェック
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          $errs = $null
          foreach ($f in @('install.ps1','uninstall.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          }
          Write-Host "syntax OK"

      - name: クリーン環境でインストール
        run: ./install.ps1

      - name: 配置されたものを確認
        run: |
          $c = $env:OSK_CLAUDE_DIR
          if ((Get-ChildItem "$c\commands" -Filter "vault-*.md").Count -ne 5) { throw "wrong command count" }
          if ((Get-ChildItem "$c\skills" -Directory).Count -ne 3) { throw "wrong skill count" }
          if ((Get-ChildItem "$c\skills\vault-scaffold\references" -Filter "*.md").Count -ne 5) { throw "missing references" }
          if (-not (Test-Path "$c\.obsidian-starter-kit-manifest")) { throw "manifest missing" }
          Write-Host OK

      - name: 2回目の実行でも失敗しないこと
        run: ./install.ps1

      - name: 他人の同名コマンドを上書きしないこと
        run: |
          $c = $env:OSK_CLAUDE_DIR
          Remove-Item "$c\.obsidian-starter-kit-manifest" -Force
          Set-Content "$c\commands\vault-save.md" "MY-OWN-COMMAND"
          # Run in a separate process: an in-process exit would end this step itself.
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -eq 0) { throw "conflict not detected" }
          if (-not ((Get-Content "$c\commands\vault-save.md" -Raw) -match "MY-OWN-COMMAND")) { throw "user file was clobbered" }
          Write-Host OK
          $global:LASTEXITCODE = 0

      - name: 上書き後アンインストールで元に戻ること
        run: |
          $c = $env:OSK_CLAUDE_DIR
          $env:OSK_FORCE = "1"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          $env:OSK_FORCE = $null
          if (-not ((Get-Content "$c\.obsidian-starter-kit-backup\commands\vault-save.md" -Raw) -match "MY-OWN-COMMAND")) { throw "backup not created" }
          & "$env:OSK_KIT_DIR\uninstall.ps1"
          if (-not ((Get-Content "$c\commands\vault-save.md" -Raw) -match "MY-OWN-COMMAND")) { throw "restore failed" }
          if (Test-Path "$c\commands\vault-init.md") { throw "kit command still present" }
          Write-Host OK
          $global:LASTEXITCODE = 0

  # ── PowerShell 7 ──────────────────────────────────────────────────────────
  windows-pwsh7:
    name: windows / PowerShell 7
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      OSK_REPO_URL: ${{ github.workspace }}
      OSK_KIT_DIR: ${{ github.workspace }}\..\osk-kit7
      OSK_CLAUDE_DIR: ${{ github.workspace }}\..\osk-claude7
    steps:
      - uses: actions/checkout@v4

      - name: バージョンと構文チェック
        run: |
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          $errs = $null
          foreach ($f in @('install.ps1','uninstall.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          }
          Write-Host "syntax OK"

      - name: クリーン環境でインストール
        run: ./install.ps1

      - name: 配置されたものを確認
        run: |
          $c = $env:OSK_CLAUDE_DIR
          if ((Get-ChildItem "$c\commands" -Filter "vault-*.md").Count -ne 5) { throw "wrong command count" }
          if ((Get-ChildItem "$c\skills" -Directory).Count -ne 3) { throw "wrong skill count" }
          if (-not (Test-Path "$c\.obsidian-starter-kit-manifest")) { throw "manifest missing" }
          Write-Host OK

      - name: 他人の同名コマンドを上書きしないこと
        run: |
          $c = $env:OSK_CLAUDE_DIR
          Remove-Item "$c\.obsidian-starter-kit-manifest" -Force
          Set-Content "$c\commands\vault-save.md" "MY-OWN-COMMAND"
          # Run in a separate process (an in-process exit would end this step).
          & pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -eq 0) { throw "conflict not detected" }
          Write-Host OK
          $global:LASTEXITCODE = 0

  # ── PowerShell 5.1 互換性の静的解析 ───────────────────────────────────────
  ps-compat:
    name: PowerShell 5.1 互換性チェック
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer で 5.1 互換性を検査
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = @{
            Rules = @{
              PSUseCompatibleSyntax   = @{ Enable = $true; TargetVersions = @('5.1','7.0') }
              PSUseCompatibleCommands = @{
                Enable = $true
                TargetProfiles = @('win-8_x64_10.0.17763.0_5.1.17763.316_x64_4.0.30319.42000_framework')
              }
            }
          }
          $bad = 0
          foreach ($f in @('install.ps1','uninstall.ps1')) {
            $r = Invoke-ScriptAnalyzer -Path $f -Settings $settings
            $compat = @($r | Where-Object { $_.RuleName -like '*Compatible*' })
            if ($compat.Count -gt 0) {
              Write-Host "── $f ── 5.1 非互換 $($compat.Count) 件"
              $compat | ForEach-Object { Write-Host "  行$($_.Line): $($_.Message)" }
              $bad += $compat.Count
            } else {
              Write-Host "── $f ── 5.1 非互換なし"
            }
          }
          if ($bad -gt 0) { exit 1 }

  # ── 公開URLからの「1行インストール」そのものを検証 ────────────────────────
  # 他のジョブはローカルの install.sh を実行している。ここは受講者と同じく
  # 公開URLから取得して実行する。checkout しないのが要点（素の環境に近い）。
  oneliner-posix:
    name: 1行インストール / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OSK_KIT_DIR: ${{ github.workspace }}/ol-kit
      OSK_CLAUDE_DIR: ${{ github.workspace }}/ol-claude
    steps:
      - name: 公開URLから1行で入れる
        run: curl -fsSL https://raw.githubusercontent.com/kousoeie-beep/obsidian-starter-kit/main/install.sh | bash

      - name: 1行で vault まで作れるか
        run: |
          set -e
          bash "$OSK_KIT_DIR/install.sh" --vault "$GITHUB_WORKSPACE/ol-vault" --type 2
          test -d "$GITHUB_WORKSPACE/ol-vault/02_議事録"
          test -f "$GITHUB_WORKSPACE/ol-vault/00_はじめに.md"
          test -f "$GITHUB_WORKSPACE/ol-vault/_ログ.md"
          test -f "$GITHUB_WORKSPACE/ol-vault/Templates/デイリーノート.md"
          for f in "$GITHUB_WORKSPACE/ol-vault"/.obsidian/*.json; do node -e "JSON.parse(require(\"fs\").readFileSync(process.argv[1],\"utf8\"))" "$f"; done
          echo OK

      - name: フォルダ名を変えても設定が追従すること
        run: |
          set -e
          V="$GITHUB_WORKSPACE/renamed-vault"
          bash "$OSK_KIT_DIR/install.sh" --vault "$V" --type 2 --folders "インボックス,MTG,案件,ノウハウ,連絡先"
          nff=$(node -pe "JSON.parse(require('fs').readFileSync('$V/.obsidian/app.json','utf8')).newFileFolderPath")
          test -d "$V/$nff" || { echo "newFileFolderPath が存在しない: $nff"; exit 1; }
          df=$(node -pe "JSON.parse(require('fs').readFileSync('$V/.obsidian/daily-notes.json','utf8')).folder")
          test -d "$V/$df" || { echo "daily.folder が存在しない: $df"; exit 1; }
          test -d "$V/01_インボックス"
          test -d "$V/02_MTG"
          grep -q '01_インボックス' "$V/00_はじめに.md"
          echo OK

      - name: 入ったか確認
        run: |
          set -e
          test "$(ls "$OSK_CLAUDE_DIR"/commands/vault-*.md | wc -l)" -eq 5
          test "$(ls -d "$OSK_CLAUDE_DIR"/skills/vault-* | wc -l)" -eq 3
          test -f "$OSK_CLAUDE_DIR/skills/vault-scaffold/SKILL.md"
          echo OK

  oneliner-windows:
    name: 1行インストール / windows (PowerShell 5.1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      OSK_KIT_DIR: ${{ github.workspace }}\ol-kit
      OSK_CLAUDE_DIR: ${{ github.workspace }}\ol-claude
    steps:
      - name: install with the documented one-liner
        run: |
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; iex ((irm https://raw.githubusercontent.com/kousoeie-beep/obsidian-starter-kit/main/install.ps1).TrimStart([char]0xFEFF))

      - name: build a vault in one line
        run: |
          # Do not reference Japanese file names here: PS5.1 reads this temp file as ANSI
          # and the names get mangled. Verify by counts and ASCII-only paths instead.
          $v = "$env:GITHUB_WORKSPACE\ol-vault"
          & "$env:OSK_KIT_DIR\install.ps1" --vault $v --type 2
          if (-not (Test-Path $v)) { throw "vault not created" }
          if ((Get-ChildItem $v -Directory).Count -lt 6) { throw "not enough folders" }
          if ((Get-ChildItem $v -Filter "*.md").Count -lt 3) { throw "not enough notes" }
          if (-not (Test-Path "$v\Templates")) { throw "Templates missing" }
          if (-not (Test-Path "$v\.obsidian\app.json")) { throw "obsidian config missing" }
          Write-Host OK
          $global:LASTEXITCODE = 0

      - name: verify
        run: |
          $c = $env:OSK_CLAUDE_DIR
          if ((Get-ChildItem "$c\commands" -Filter "vault-*.md").Count -ne 5) { throw "wrong command count" }
          if ((Get-ChildItem "$c\skills" -Directory).Count -ne 3) { throw "wrong skill count" }
          if (-not (Test-Path "$c\skills\vault-scaffold\SKILL.md")) { throw "skill missing" }
          Write-Host OK
